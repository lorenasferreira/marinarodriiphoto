spring.application.name=backend

spring.jpa.hibernate.ddl-auto=validate
spring.data.jpa.repositories.enabled=false

spring.flyway.enabled=false
spring.flyway.clean-disabled=true

server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

portfolio.upload.max-file-size=${PORTFOLIO_UPLOAD_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-file-size=${portfolio.upload.max-file-size}
spring.servlet.multipart.max-request-size=${PORTFOLIO_UPLOAD_MAX_REQUEST_SIZE:21MB}

#---
spring.config.activate.on-profile=!production
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DEV_DB_URL}
spring.datasource.username=${DEV_DB_USERNAME}
spring.datasource.password=${DEV_DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=${DEV_FLYWAY_ENABLED:false}
server.servlet.session.cookie.secure=${ADMIN_SESSION_COOKIE_SECURE:true}
