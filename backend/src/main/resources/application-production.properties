spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

# Run Flyway explicitly from the release's pre-deploy command.
spring.flyway.enabled=false
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# HTTPS terminates at the proxy. Sessions and logout use explicit secure cookies.
server.forward-headers-strategy=none
server.servlet.session.cookie.secure=true
spring.mvc.log-request-details=false
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
